[pytest]
testpaths = tests
addopts = -ra --strict-markers
timeout = 120
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    unit: fast isolated tests, no network, no GUI
    server: relay server components (in-process, no network)
    integration: client <-> local relay end-to-end over loopback
    adversarial: malicious relay / malicious peer scenarios
    ui: CustomTkinter GUI tests (need a display)
    live: talks to the production relay; never runs by default
filterwarnings =
    ignore::DeprecationWarning:websockets.*

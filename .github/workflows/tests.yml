# ──────────────────────────────────────────────────────────────
#  SecureShare Tests — unit, server, integration, adversarial, UI
#
#  Runs on Windows and Linux. Everything talks to a relay server
#  started in-process on loopback; nothing reaches production.
#  Also callable from release.yml (workflow_call) as a release gate.
# ──────────────────────────────────────────────────────────────

name: Tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "tests/**"
      - "main.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".coveragerc"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "tests/**"
      - "main.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".coveragerc"
      - ".github/workflows/tests.yml"
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: System packages for Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest --cov --cov-report=term

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest --cov --cov-report=term

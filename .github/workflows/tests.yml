# ──────────────────────────────────────────────────────────────
#  SecureShare Tests — unit, server, integration, adversarial, UI
#
#  Runs on Windows and Linux. Everything talks to a relay server
#  started in-process on loopback; nothing reaches production.
#  Also callable from release.yml (workflow_call) as a release gate.
# ──────────────────────────────────────────────────────────────

name: Tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "tests/**"
      - "main.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".coveragerc"
      - "scripts/ui_screenshots.py"
      - "mobile/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "tests/**"
      - "main.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".coveragerc"
      - "scripts/ui_screenshots.py"
      - "mobile/**"
      - ".github/workflows/tests.yml"
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            server/requirements.txt

      - name: System packages for Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest --cov --cov-report=term

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest --cov --cov-report=term

  screenshots:
    name: UI screenshots (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            server/requirements.txt

      - name: System packages for Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: pip install -r requirements.txt pillow

      - name: Capture (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/ui_screenshots.py ui-screenshots

      - name: Capture (Windows)
        if: runner.os == 'Windows'
        run: python scripts/ui_screenshots.py ui-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ runner.os }}
          path: ui-screenshots/*.png
          retention-days: 14

  android-core:
    name: Android core (Dart) + interop with Python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      # interop tests start the repo's relay and Python CLI client
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt

      - name: Python dependencies (relay + CLI peer)
        working-directory: .
        run: pip install "cryptography>=46.0.5" "websocket-client>=1.7.0" certifi -r server/requirements.txt

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Protocol vectors + interop with the Python client + memory
        env:
          PYTHON: python
        run: flutter test

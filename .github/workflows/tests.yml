# ──────────────────────────────────────────────────────────────
#  SecureShare Tests — unit, server, integration, adversarial, UI
#
#  Runs on Windows and Linux. Everything talks to a relay server
#  started in-process on loopback; nothing reaches production.
#  Also callable from release.yml (workflow_call) as a release gate.
# ──────────────────────────────────────────────────────────────

name: Tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "tests/**"
      - "main.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".coveragerc"
      - "scripts/ui_screenshots.py"
      - "scripts/local_relay.py"
      - "scripts/android_e2e.py"
      - "mobile/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "tests/**"
      - "main.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".coveragerc"
      - "scripts/ui_screenshots.py"
      - "scripts/local_relay.py"
      - "scripts/android_e2e.py"
      - "mobile/**"
      - ".github/workflows/tests.yml"
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            server/requirements.txt

      - name: System packages for Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest --cov --cov-report=term

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest --cov --cov-report=term

  screenshots:
    name: UI screenshots (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            server/requirements.txt

      - name: System packages for Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: pip install -r requirements.txt pillow

      - name: Capture (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/ui_screenshots.py ui-screenshots

      - name: Capture (Windows)
        if: runner.os == 'Windows'
        run: python scripts/ui_screenshots.py ui-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ runner.os }}
          path: ui-screenshots/*.png
          retention-days: 14

  android-core:
    name: Android (Dart, UI, interop with Python)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      # interop tests start the repo's relay and Python CLI client
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt

      - name: Python dependencies (relay + CLI peer)
        working-directory: .
        run: pip install "cryptography>=46.0.5" "websocket-client>=1.7.0" certifi -r server/requirements.txt

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      # real fonts for the screenshots: Roboto, emoji, a monospace font
      - name: Fonts
        working-directory: .
        run: sudo apt-get install -y --no-install-recommends fonts-roboto fonts-noto-color-emoji fonts-dejavu-core

      - name: Protocol vectors, screens, translations, interop with the Python client, memory
        env:
          PYTHON: python
        run: flutter test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: mobile/build/screenshots/
          if-no-files-found: ignore

  android-e2e:
    name: Android ${{ matrix.android }} emulator (end-to-end with the PC client)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - android: "14"
            api-level: 34
          - android: "10"   # legacy storage: Download/ needs the runtime permission
            api-level: 29
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt

      - name: Python dependencies (relay + CLI peer)
        run: pip install "cryptography>=46.0.5" "websocket-client>=1.7.0" certifi -r server/requirements.txt

      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python scripts/android_e2e.py --mb 32
